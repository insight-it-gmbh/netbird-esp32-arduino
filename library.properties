name=netbird-lite
version=0.3.0
author=Insight-IT GmbH
maintainer=Dominic Ballenthin <194654304+subbie5000@users.noreply.github.com>
sentence=NetBird client for ESP32: joins an ESP32 to a NetBird network as a peer.
paragraph=Registers with a setup key, receives the network map from NetBird management, negotiates connections over signal and tunnels WireGuard through the NetBird relay. The device gets its NetBird IP on an lwIP interface, so WiFiClient, WebServer, HTTPClient and MQTT clients work over the tunnel. Enforces the NetBird access policies with a stateful firewall. Relay only (no direct P2P connections), IPv4 only. For the arduino-esp32 core 3.2 or newer.
category=Communication
url=https://github.com/insight-it-gmbh/netbird-esp32-arduino
architectures=esp32
includes=NetBirdLite.h
